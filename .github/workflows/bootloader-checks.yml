name: U-Boot development checks (no installation)
on:
  push:
    paths: ['bootloader/**', '.github/workflows/bootloader-checks.yml']
  pull_request:
    paths: ['bootloader/**', '.github/workflows/bootloader-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootloader-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        profile: [prototype, integrated]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-aarch64-linux-gnu bison flex bc pkg-config libssl-dev libgnutls28-dev libsdl2-dev uuid-dev libelf-dev liblzma-dev libzstd-dev liblz4-dev swig python3-dev python3-setuptools python3-pyelftools python3-yaml python3-jsonschema device-tree-compiler libfdt-dev efitools
      - name: Fetch pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          manifest=bootloader/prototype.json
          if test "${{ matrix.profile }}" = integrated; then manifest=bootloader/integrated/manifest.json; fi
          pin=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["base_commit"])' "$manifest")
          git init "$RUNNER_TEMP/u-boot"
          git -C "$RUNNER_TEMP/u-boot" remote add origin https://github.com/AsahiLinux/u-boot.git
          git -C "$RUNNER_TEMP/u-boot" fetch --depth=1 origin "$pin"
          git -C "$RUNNER_TEMP/u-boot" checkout --detach FETCH_HEAD
      - name: Apply patches, run sandbox tests and cross-build Apple M1
        run: |
          if test "${{ matrix.profile }}" = integrated; then
            python3 bootloader/integrated/build.py "$RUNNER_TEMP/u-boot" "$RUNNER_TEMP/integrated-build" --jobs 4
          else
            python3 bootloader/build-prototype.py "$RUNNER_TEMP/u-boot" "$RUNNER_TEMP/prototype-build" --jobs 4
          fi
      - name: Record software-only result
        if: always()
        shell: bash
        run: |
          printf 'Software checks only; hardware coverage is recorded separately in the integration evidence. No installation or release publication.\n' >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/${{ matrix.profile }}-build/result.json"; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/${{ matrix.profile }}-build/result.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          else
            find "$RUNNER_TEMP/${{ matrix.profile }}-build" -maxdepth 1 -name '*.log' -exec sh -c 'echo "$1"; grep -n -E -C 3 "error:|fatal:|Error|not found|No such|Traceback|Exception|FAILED" "$1" || true; tail -n 30 "$1"' sh {} \;
            exit 1
          fi
