name: U-Boot development checks (no installation)
on:
  push:
    paths: ['bootloader/**', '.github/workflows/bootloader-checks.yml']
  pull_request:
    paths: ['bootloader/**', '.github/workflows/bootloader-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootloader-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-aarch64-linux-gnu bison flex bc pkg-config libssl-dev libgnutls28-dev libsdl2-dev uuid-dev libelf-dev swig python3-dev python3-setuptools python3-pyelftools python3-yaml device-tree-compiler
      - name: Fetch pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          pin=$(python3 -c 'import json; print(json.load(open("bootloader/prototype.json"))["base_commit"])')
          git init "$RUNNER_TEMP/u-boot"
          git -C "$RUNNER_TEMP/u-boot" remote add origin https://github.com/AsahiLinux/u-boot.git
          git -C "$RUNNER_TEMP/u-boot" fetch --depth=1 origin "$pin"
          git -C "$RUNNER_TEMP/u-boot" checkout --detach FETCH_HEAD
      - name: Apply patches, run sandbox tests and cross-build Apple M1
        run: python3 bootloader/build-prototype.py "$RUNNER_TEMP/u-boot" "$RUNNER_TEMP/prototype-build" --jobs 4
      - name: Record software-only result
        if: always()
        shell: bash
        run: |
          printf 'Development prototype only. No hardware validation or Thunderbolt boot claim. No installation or release publication.\n' >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/prototype-build/result.json"; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/prototype-build/result.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          else
            find "$RUNNER_TEMP/prototype-build" -maxdepth 1 -name '*.log' -exec sh -c 'echo "$1"; tail -n 30 "$1"' sh {} \;
            exit 1
          fi
