name: Consolidated M1 kernel (build only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: consolidated-m1-full-build
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Runner capacity and toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Disposable hosted runner only: remove unused preinstalled SDK caches.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-15 g++-15 make bc bison flex libssl-dev libelf-dev libncurses-dev pkg-config python3 git kmod zstd xz-utils rustc rust-src bindgen libclang-21-dev llvm-21 lld-21 pahole cpio rsync
          sudo apt-get clean
          df -h
          free -h
          available=$(df --output=avail -BG "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          if (( available < 45 )); then
            echo "Insufficient build space: ${available} GiB; need at least 45 GiB with all distro debug/module features."
            exit 1
          fi
      - name: Full Image, modules and DTBs
        run: build/full-kernel.sh
      - name: Save outputs to a private draft release (no Actions artifacts)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tag="kernel-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'Private build-only output. No deployment.\nRun: %s/%s/actions/runs/%s\nCommit: %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > artifacts/RUN.txt
          if test -f artifacts/RESULT.txt; then
            cp artifacts/RESULT.txt artifacts/release-notes.txt
          else
            printf 'Build incomplete or failed. Diagnostics only; not an installable verified kernel.\n' > artifacts/release-notes.txt
          fi
          cat artifacts/RUN.txt >> artifacts/release-notes.txt
          python3 build/prepare-assets.py
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Kernel build ${GITHUB_RUN_ID} (not installed)" --notes-file artifacts/release-notes.txt
          find artifacts -maxdepth 1 -type f -print0 | xargs -0 -n1 gh release upload "$tag" --repo "$GITHUB_REPOSITORY"
          printf 'Private draft release: %s/%s/releases\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
