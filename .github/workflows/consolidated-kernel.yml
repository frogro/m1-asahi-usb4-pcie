name: Consolidated M1 kernel (build only)
on:
  workflow_dispatch:
    inputs:
      include_egpu:
        description: 'Build experimental 45-patch eGPU integration (hardware validation pending)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: consolidated-m1-full-build
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reserve and verify release upload before compilation
        id: release_prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/release-output.py prepare
      - name: Runner capacity and toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Disposable hosted runner only: remove unused preinstalled SDK caches.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm /usr/share/swift /opt/google /opt/microsoft /opt/az /usr/share/miniconda /usr/share/gradle /usr/share/maven
          sudo docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-15 g++-15 make bc bison flex libssl-dev libelf-dev libncurses-dev pkg-config python3 git kmod zstd xz-utils rustc rust-src bindgen libclang-21-dev clang-21 llvm-21 lld-21 meson ninja-build pahole cpio rsync
          sudo apt-get clean
          df -h
          free -h
          available=$(df --output=avail -BG "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          if (( available < 45 )); then
            echo "Insufficient build space: ${available} GiB; need at least 45 GiB with all distro debug/module features."
            exit 1
          fi
      - name: Full Image, modules and DTBs
        env:
          INCLUDE_EGPU: ${{ inputs.include_egpu }}
        run: build/full-kernel.sh
      - name: Save outputs to a draft release (no Actions artifacts)
        if: always() && steps.release_prepare.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/release-output.py upload
