# This Mac: two visible OS choices. Original Apple Ubuntu remains recovery.
terminal_input console
terminal_output console
set timeout_style=menu
set timeout=15
set default=ubuntu-asahi
insmod part_gpt
insmod ext2
insmod fat
insmod gzio
function load_video {
 insmod efi_gop
}
if search --no-floppy --fs-uuid --set=menuesp 44FD-1525; then
 if [ -f ($menuesp)/EFI/Asahi/grubenv ]; then
  load_env -f ($menuesp)/EFI/Asahi/grubenv
  if [ -n "$next_entry" ]; then
   set default=$next_entry
   set next_entry=
   save_env -f ($menuesp)/EFI/Asahi/grubenv next_entry
  fi
 fi
fi
menuentry 'Ubuntu Asahi' --id ubuntu-asahi {
 if search --no-floppy --fs-uuid --set=ubuntu e10cc27a-5892-4594-befa-2c74255c78cf; then
  if linux ($ubuntu)/Image-7.2.12-usb4sd4-egpu3 root=UUID=1d4d5fd6-ea8a-4bb0-bf3c-2fc1f9e65935 rootwait rw console=tty0 console=ttySAC0,115200n8 earlycon loglevel=7 panic=20 rd.retry=60 rd.timeout=90 rd.shell=0 rd.emergency=reboot pcie_apple_pciec.pciec_topology_events=1 pcie_apple_pciec.pciec_link_events=0 pcie_apple_pciec.pciec_reset_ack_clear=0 pciehp.pciehp_poll_mode=0 pci=hpbussize=16,hpmmiosize=32M,hpmmioprefsize=512M,realloc=on appledrm.hdmi_audio=1 amdgpu.runpm=0 amdgpu.aspm=0 amdgpu.rebar=0 systemd.unit=graphical.target; then
   if initrd ($ubuntu)/initrd.usb4-root-egpu3; then
    boot
   fi
  fi
 fi
 # No usable external Ubuntu: retain the existing internal kernel symlinks.
 if search --no-floppy --fs-uuid --set=ubuntu ae166e90-c1e7-4f97-af59-cceb701bd7d9; then
  load_video
  if linux ($ubuntu)/vmlinuz root=UUID=e4d52d5a-56e9-4320-90f4-4223563b08d6 ro  quiet splash crashkernel=2G-4G:320M,4G-32G:512M,32G-64G:1024M,64G-128G:2048M,128G-:4096M; then
   if initrd ($ubuntu)/initrd.img; then
    boot
   fi
  fi
 fi
 echo 'Ubuntu konnte nicht geladen werden. Originalen Apple-Eintrag Ubuntu verwenden.'
 sleep --interruptible 15
}
menuentry 'Googlebooks' --id googlebooks {
 load_video
 if search --no-floppy --fs-uuid --set=gboot ae166e90-c1e7-4f97-af59-cceb701bd7d9; then
  if linux ($gboot)/googlebook-reference-20261027/Image root=/dev/ram0 rdinit=/m1-bootstrap init=/init console=tty0 loglevel=4 firmware_class.path=/vendor/lib/modules/firmware sysctl.kernel.firmware_config.ignore_sysfs_fallback=1 panic=30 selinux=1 enforcing=1 androidboot.hardware=android-desktop androidboot.hardware.platform=android-desktop androidboot.boot_part_uuid=e38138fa-d1a2-41f1-a408-0d303b1f3700 androidboot.slot_suffix=_a androidboot.force_normal_boot=1 androidboot.verifiedbootstate=orange androidboot.selinux=enforcing androidboot.vendor.apex.com.android.hardware.keymint.strongbox.desktop=none udmabuf.size_limit_mb=256; then
   if initrd ($gboot)/googlebook-reference-20261027/initrd.img; then
    boot
   fi
  fi
 fi
 echo 'Googlebooks-Startdateien fehlen. Originalen Apple-Eintrag Ubuntu verwenden.'
 sleep --interruptible 15
}
