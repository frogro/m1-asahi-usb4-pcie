terminal_input console
terminal_output console
set timeout_style=menu
set timeout=15
set default=1
# One-shot selection is stored on this Mac's independent Asahi ESP, which
# remains writable even when the external TB device is exposed read-only.
if search --no-floppy --fs-uuid --set=menuesp 44FD-1525; then
 if [ -f ($menuesp)/EFI/Asahi/grubenv ]; then
  load_env -f ($menuesp)/EFI/Asahi/grubenv
  if [ -n "$next_entry" ]; then
   set default=$next_entry
   set next_entry=
   save_env -f ($menuesp)/EFI/Asahi/grubenv next_entry
  fi
 fi
fi

menuentry 'Ubuntu Asahi 7.2.12-usb4sd4-egpu3 - Samsung 970 EVO Plus - Textkonsole - Diagnose' {
 if search --no-floppy --fs-uuid --set=tbroot e10cc27a-5892-4594-befa-2c74255c78cf; then
  if linux ($tbroot)/Image-7.2.12-usb4sd4-egpu3 root=UUID=1d4d5fd6-ea8a-4bb0-bf3c-2fc1f9e65935 rootwait rw console=tty0 console=ttySAC0,115200n8 earlycon loglevel=7 panic=20 rd.retry=60 rd.timeout=90 rd.shell=0 rd.emergency=reboot pcie_apple_pciec.pciec_topology_events=1 pcie_apple_pciec.pciec_link_events=0 pcie_apple_pciec.pciec_reset_ack_clear=0 pciehp.pciehp_poll_mode=0 pci=hpbussize=16,hpmmiosize=32M,hpmmioprefsize=512M,realloc=on appledrm.hdmi_audio=1 amdgpu.runpm=0 amdgpu.aspm=0 amdgpu.rebar=0 systemd.unit=multi-user.target; then
   if initrd ($tbroot)/initrd.img-7.2.12-usb4sd4-egpu3; then
    boot
   fi
  fi
 fi
 echo 'Start fehlgeschlagen. Neustart zum internen Ubuntu.'
 sleep 5
 reboot
}

