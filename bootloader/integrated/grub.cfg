menuentry 'Ubuntu intern - bestehendes Menue und Testeintraege' {
 if search --no-floppy --fs-uuid --set=target ae166e90-c1e7-4f97-af59-cceb701bd7d9; then
  if [ -f ($target)/grub/grub.cfg ]; then
   set root=$target
   set prefix=($target)/grub
   configfile ($target)/grub/grub.cfg
  fi
 fi
 echo 'Startmedium oder GRUB-Konfiguration nicht gefunden.'
 sleep --interruptible 10
}

