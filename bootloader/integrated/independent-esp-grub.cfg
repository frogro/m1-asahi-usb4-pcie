terminal_input console
terminal_output console
set timeout_style=menu
set timeout=15
set default=0
# One-shot selection is stored on this Mac's independent Asahi ESP, which
# remains writable even when the external TB device is exposed read-only.
if search --no-floppy --fs-uuid --set=menuesp 44FD-1525; then
 if [ -f ($menuesp)/EFI/Asahi/grubenv ]; then
  load_env -f ($menuesp)/EFI/Asahi/grubenv
  if [ -n "$next_entry" ]; then
   set default=$next_entry
   set next_entry=
   save_env -f ($menuesp)/EFI/Asahi/grubenv next_entry
  fi
 fi
fi

menuentry 'Ubuntu intern - vorhandenes System' {
 if search --no-floppy --fs-uuid --set=target ae166e90-c1e7-4f97-af59-cceb701bd7d9; then
  set root=$target
  set prefix=($target)/grub
  configfile ($target)/grub/grub.cfg
 fi
 echo 'Internes Ubuntu-Menue nicht gefunden.'
 sleep --interruptible 10
}
