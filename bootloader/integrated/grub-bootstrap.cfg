terminal_input console
terminal_output console
if search --no-floppy --fs-uuid --set=target e10cc27a-5892-4594-befa-2c74255c78cf; then
 set root=$target
 set prefix=($target)/grub
 configfile ($target)/grub/grub.cfg
fi
echo 'GRUB-Konfiguration des externen Systems nicht gefunden.'
sleep --interruptible 10
